language: python
python:
  - "3.12"

cache: pip

install:
  - pip install -r requirements.txt
  - pip install -r requirements-dev.txt

before_script:
  - black --check .
  - flake8 .

script:
  - coverage run --source='.' manage.py test

after_success:
  - coveralls

deploy:
  provider: elasticbeanstalk
  edge: true
  region: "us-east-1"
  app: "swe1-app"
  env: "Swe1-app-env"
  bucket: "elasticbeanstalk-us-east-1-050129644695"
  on:
    branch: main
